<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

<h1>Login</h1>

<form action="" method="post"></form>
    <div>
        <label for="usuario">Usuario:</label>
        <input type="text" name="usuario" id="usuario" placeholder="Ingrese su usuario" value="">
    </div>

<div>
        <label for="correo">Correo:</label>
        <input type="text" name="correo" id="correo" placeholder="Ingrese su correo" value="">
    </div>

    <div>
        <label for="password">Contraseña:</label>
        <input type="password" name="password" id="password" placeholder="Ingrese su contraseña" value="">
    </div>

    <div>
        <input type="submit" value="Iniciar sesión">

    </div>

    <button type="submit">Ingresar</button>


</body>
</html>
