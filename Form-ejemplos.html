<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form extra</title>
</head>
<body>

    <form action="" method="get">
        <div>
            <label for="ciudad">Ciudad:</label>
            <select name="ciudad" id="Ciudad" multiple></select>
            <option value=""></option>
            <option value="Tx">Texas</option>
            <option value="Ny">New York</option>
            <option value="Ca">California</option>

        </div>

        <div>
            <h2>Lenguajes de programación</h2>
            <label for="Lenguaje">Lenguaje:</label>
            <input type="radio" name="lenguaje" id="html" value="HTML">
            <label for="html">HTML</label>
            <input type="radio" name="lenguaje" id="css" value="CSS">
            <label for="css">CSS</label>
            <input type="radio" name="lenguaje" id="js" value="JavaScript">
            <label for="js">JavaScript</label>
        </div>




    </form>
    
</body>
</html>
